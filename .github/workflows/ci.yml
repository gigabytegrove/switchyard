name: Switchyard quality gates
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Backend test suite
        run: python -m pytest -q
      - name: Frontend syntax checks
        run: |
          node --check static/app.js
          node --check static/spice-view.js
  image-build:
    runs-on: ubuntu-24.04
    needs: source-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image with browser runtime assets
        run: docker build --pull --tag switchyard:test .
      - name: Check image includes mandatory runtime assets
        run: docker run --rm --entrypoint /bin/bash switchyard:test /usr/local/bin/verify-runtime-assets /app/static
      - name: Start disposable Compose installation and exercise HTTP routes
        run: |
          docker tag switchyard:test switchyard:0.4.0
          mkdir -p secrets
          printf '%s\n' 'github-actions-disposable-ci-password' > secrets/admin_password.txt
          chmod 644 secrets/admin_password.txt
          printf 'PUBLIC_ORIGIN=http://127.0.0.1:9791\nCOOKIE_SECURE=false\nSWITCHYARD_BIND=127.0.0.1\n' > .env
          docker compose up -d --no-build --wait --wait-timeout 120
          bash scripts/smoke-test.sh
      - name: Capture Compose logs on failure
        if: failure()
        run: docker compose logs --tail=200 || true
      - name: Remove disposable Compose services and volumes
        if: always()
        run: docker compose down -v --remove-orphans || true
