name: Switchyard quality gates
concurrency:
  group: switchyard-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Backend and setup wizard regression suite
        run: python -m pytest -q
      - name: Frontend and deployment script checks
        run: |
          node --check static/app.js
          node tests/test_client_session_id.cjs
          node tests/test_workbench_interactions.cjs
          node tests/test_multiconnect.cjs
          node tests/test_reconnect_session.cjs
          node tests/test_credential_retries.cjs
          node tests/test_ssh_host_trust_flow.cjs
          node tests/test_desktop_session_reuse.cjs
          node tests/test_navigation_browser.cjs
          node --check static/spice-view.js
          bash -n scripts/deploy.sh scripts/smoke-test.sh
          ! grep -Eq 'ADMIN_PASSWORD_FILE|MFA_KEY_FILE|PUBLIC_ORIGIN|LAN_ORIGINS|ALLOW_HTTP_VAULT' compose.yaml
      - name: Prepare isolated local OpenSSH test target
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          sudo useradd -m -s /bin/bash switchyardci
          printf 'switchyardci:disposable-ci-ssh-credential-2026\n' | sudo chpasswd
          cat > /tmp/switchyard-ci-sshd.conf <<'SSHD'
          Port 22222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PubkeyAuthentication no
          PermitRootLogin no
          AllowUsers switchyardci
          UsePAM no
          StrictModes yes
          Subsystem sftp /usr/lib/openssh/sftp-server
          SSHD
          sudo /usr/sbin/sshd -f /tmp/switchyard-ci-sshd.conf -E /tmp/switchyard-ci-sshd.log
          for n in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/22222) 2>/dev/null && exit 0
            sleep 1
          done
          sudo tail -n 60 /tmp/switchyard-ci-sshd.log
          exit 1
      - name: Real SSH, SFTP and terminal protocol acceptance
        env:
          SWITCHYARD_SSH_E2E: '1'
        run: timeout 90s python -m pytest -q tests/test_live_ssh_e2e.py
  image-build:
    runs-on: ubuntu-24.04
    needs: source-tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image with browser runtime assets
        run: docker build --pull --label org.opencontainers.image.source=https://github.com/gigabytegrove/switchyard --tag ghcr.io/gigabytegrove/switchyard:0.5.10-dev.1 .
      - name: Check image includes mandatory runtime assets
        run: docker run --rm --entrypoint /bin/bash ghcr.io/gigabytegrove/switchyard:0.5.10-dev.1 /usr/local/bin/verify-runtime-assets /app/static
      - name: Start disposable zero-configuration Compose deployment
        run: |
          test ! -e .env
          test ! -e secrets
          docker compose up -d --no-build --wait
          bash scripts/smoke-test.sh
      - name: Exercise first-run wizard and authenticated API via HTTP
        run: |
          python3 - <<'PY'
          import json, re, subprocess, urllib.request, urllib.error
          base='http://127.0.0.1:9791'
          log=subprocess.check_output(['docker','compose','logs','--no-color','switchyard'],text=True)
          code=re.search(r'SWITCHYARD FIRST-RUN CLAIM CODE: ([A-F0-9-]{26})',log)
          assert code is not None, 'first boot must display claim code'
          def request(path,method='GET',data=None,cookie=''):
              req=urllib.request.Request(base+path,method=method,headers={
                  'Origin':base,'Content-Type':'application/json',
                  **({'Cookie':cookie} if cookie else {})},
                  data=json.dumps(data).encode() if data is not None else None)
              return urllib.request.urlopen(req,timeout=10)
          assert request('/api/setup/status').read().find(b'true')!=-1
          with request('/api/setup/complete','POST',{
              'claim_code':code.group(1),'username':'ci-admin',
              'password':'ci-disposable-development-password-2026'}) as resp:
              assert resp.status==200
          assert json.loads(request('/api/setup/status').read())['setup_required'] is False
          with request('/api/login','POST',{'username':'ci-admin','password':'ci-disposable-development-password-2026'}) as resp:
              cookie=resp.headers['Set-Cookie'].split(';',1)[0]
          assert json.loads(request('/api/me',cookie=cookie).read())['username']=='ci-admin'
          assert json.loads(request('/api/network',cookie=cookie).read())['lan_origins']==[]
          print('PASS: clean first boot, claim code, account setup, login, and persistent network configuration')
          PY
      - name: Exercise responsive console in real headless Chrome
        run: |
          python3 -m pip install --disable-pip-version-check websockets==16.0
          timeout 90s python3 scripts/probe-browser-ui.py
      - name: Upload responsive UI screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switchyard-ui-screenshots
          path: ui-artifacts/
          if-no-files-found: ignore
      - name: Real authenticated WebSocket upgrade against running Docker container
        run: |
          python3 -m pip install --disable-pip-version-check websockets==16.0
          python3 scripts/probe-websocket.py
      - name: Prove interactive SSH through the real container WebSocket
        run: |
          container_id="$(docker compose ps -q switchyard)"
          test -n "$container_id"
          docker exec -d "$container_id" /opt/venv/bin/python -c "$(cat scripts/ci-ssh-target.py)"
          python3 scripts/probe-ssh-terminal.py
      - name: Authenticate to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified application image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to publish stale image for $GITHUB_SHA (main=$current)"
            exit 1
          fi
          docker push ghcr.io/gigabytegrove/switchyard:0.5.10-dev.1
      - name: Capture Compose logs on failure
        if: failure()
        run: docker compose logs --tail=200 || true
      - name: Remove disposable Compose services and volumes
        if: always()
        run: docker compose down -v --remove-orphans || true
