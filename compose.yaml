services:
  guacd:
    image: ghcr.io/quenchworks/images/guacd@sha256:caf62c36625a2ffb3adfc2bcc51572ab4e7f5e805ae3b55f3800812eeaf3c411
    restart: unless-stopped
    networks:
      - default
      - remote_access
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.5"
  switchyard:
    depends_on:
      - guacd
    networks:
      - default
      - remote_access
    image: ghcr.io/gigabytegrove/switchyard:0.5.3-dev.5
    restart: unless-stopped
    ports:
      - "0.0.0.0:9791:9791"
    volumes:
      - switchyard_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    mem_limit: 768m
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9791/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  switchyard_data:

networks:
  remote_access:
    internal: true
